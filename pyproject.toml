[project]
name = "zotero-rag-web"
version = "0.1.0"
description = "A web chat for a team's Zotero group library, with cited answers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "zotero-rag-core[pgvector]",
    "alembic>=1.14",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
zrw = "zotero_rag_web.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
zotero-rag-core = { git = "https://github.com/jmlon/zotero-rag", subdirectory = "packages/zotero-rag-core", tag = "core-v0.5.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_rag_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_rag_web", "zotero_rag_core"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
